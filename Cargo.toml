[package]
name = "teoneo-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
axum = { version = "0.8.3", features = ["multipart", "macros"] }
chrono = "0.4.40"
dotenv = "0.15.0"
hex = "0.4.3"
jsonwebtoken = "9.3.1"
lettre = "0.11.16"
password-auth = "1.0.0"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
sqlx = { version = "0.8.5", features = ["mysql", "runtime-tokio"] }
tokio = { version = "1.44.2", features = ["full", "io-util"] }
tokio-util = { version = "0.7.15", features = ["io"] }
tower = { version = "0.5.2", features = ["buffer", "limit"] }
tower-http = { version = "0.6.2", features = ["cors", "catch-panic"] }
tracing-subscriber = "0.3.19"
