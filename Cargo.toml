[package]
name = "teoneo-auth"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
axum = { version = "0.8.3", features = ["multipart", "macros"] }
chrono = "0.4.40"
dotenv = "0.15.0"
jsonwebtoken = "9.3.1"
password-auth = "1.0.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.5", features = ["mysql", "runtime-tokio"] }
tokio = { version = "1.44.2", features = ["full", "io-util"] }
tokio-util = { version = "0.7.15", features = ["io"] }
tracing-subscriber = "0.3.19"
